spring:
  hibernate:
    dialect: org.hibernate.dialect.H2Dialect
  datasource:
    url: jdbc:h2:file:./workmanager
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
